services:
  odoo :
    image: odoo:19
    container_name: odoo_ol
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./custom-addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    networks:
      - edge_edge
      - ol_internal


  postgres:
    image: postgres:18-alpine
    container_name: postgres_ol
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ol_internal

networks:
  edge_edge:
    external: true
  ol_internal:
    name: ol_internal     # Create the network if it doesn't exist yet

volumes:
  odoo-pgdata:
  odoo-data:
