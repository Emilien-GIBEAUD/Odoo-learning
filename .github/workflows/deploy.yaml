name: Deploy on VPS

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: git pull then local build and deploy
        run: |
          cd /home/ubuntu/Projets/Odoo-learning/ol_py
          git fetch origin main
          git reset --hard origin/main

          docker compose -f compose.prod.yaml build --no-cache
          docker compose -f compose.prod.yaml up -d --force-recreate --remove-orphans
          docker image prune -f

      - name: Wait for Odoo to be ready
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' odoo_ol)" = "healthy" ]; do
            echo "Waiting for Odoo..."
            sleep 5
          done

      - name: upgrade Odoo modules
        run: |
          cd /home/ubuntu/Projets/Odoo-learning/ol_py
          docker compose -f compose.prod.yaml stop odoo

          if docker compose -f compose.prod.yaml run --rm --no-deps odoo \
              -d odoo \
              -u all \
              --stop-after-init
          then
              docker compose -f compose.prod.yaml up -d --force-recreate --no-deps odoo
          else
              echo "Odoo module upgrade failed."
              docker compose -f compose.prod.yaml up -d --force-recreate --no-deps odoo
              exit 1
          fi

          docker image prune -f
