name: Deploy on VPS

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: git pull then local build and deploy
        run: |
          cd /home/ubuntu/Projets/Odoo-learning/ol_py
          git reset --hard
          git pull origin main
          docker compose -f compose.prod.yaml build
          docker compose -f compose.prod.yaml up -d --remove-orphans
          docker image prune -f

      - name: upgrade Odoo modules
        run: |
          docker exec odoo_ol sh -c '
            odoo \
              -c /etc/odoo/odoo.conf \
              -d odoo \
              -r "$USER" \
              -w "$PASSWORD" \
              --db_host=postgres \
              --db_port=5432 \
              -u resa_table \
              --stop-after-init
          '
